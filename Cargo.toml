[workspace]
resolver = "3"
members = ["libversio", "versio-cli", "no_std_provo"]

[workspace.package]
edition = "2024"
rust-version = "1.100"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
blake3 = { version = "1", default-features = false, features = ["pure"] }
clap = { version = "4", features = ["derive"] }
lz4_flex = { version = "0.11", default-features = false, features = ["safe-encode", "safe-decode"] }
postcard = { version = "=1.0.7", default-features = false, features = ["alloc"] }
serde = { version = "1", default-features = false, features = ["alloc", "derive"] }
thiserror = { version = "2", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unused_must_use = "deny"
unreachable_pub = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
cargo = { level = "warn", priority = -1 }
module_name_repetitions = "allow"   # Esperanta nomkonvencio: la sola escepto

# Deviga malpermeso: VKS ne rajtas panei aŭ silente superflui ĉe rultempo
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
overflow-checks = true
lto = "thin"
codegen-units = 1

[package]
name = "arm64_provo"
edition = "2024"
rust-version = "1.100"
version = "0.1.0"
license = "MIT"
publish = false

# Propra laborspaco: tiu ĉi pakaĵo celas nur aarch64-unknown-none kaj ne
# rajtas esti konstruata kune kun la ĉefa laborspaco por la gastiga arkitekturo.
[workspace]

[dependencies]
libversio = { path = "../libversio", default-features = false }
semihosting = { version = "0.1", default-features = false, features = ["stdio"] }

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unused_must_use = "deny"
unreachable_pub = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
cargo = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
overflow-checks = true
lto = "thin"
codegen-units = 1

# Fast CI for the Versio workspace.
# Formal verification is manual; see kani.yml.
name: CI

on:
  # Run on every push to main and on every pull request.
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast feedback: formatting, lints, and release builds.
  lint-and-build:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The action installs the minimal profile, which omits rustfmt and
      # clippy; request them explicitly together with the bare-metal target.
      - name: Install Rust 1.100.0 with x86_64-unknown-none
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: x86_64-unknown-none
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --release -- -D warnings

      - name: Build workspace in release mode
        run: cargo build --workspace --release

      # Exercise the installed bare-metal target: libversio must stay no_std.
      - name: Build no_std sentinel for x86_64-unknown-none
        run: cargo build -p no_std_provo --target x86_64-unknown-none

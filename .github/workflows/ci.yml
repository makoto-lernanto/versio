# CI for the Versio workspace.
# Formal verification runs in the cloud because local Kani runs exhaust memory
# and disconnect the WSL2 machine.
name: CI

on:
  # Run on every push to main and on every pull request.
  push:
    branches: [main]
  pull_request:

# The workflow only reads the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Fast feedback: formatting, lints, and release builds.
  lint-and-build:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The action installs the minimal profile, which omits rustfmt and
      # clippy; request them explicitly together with the bare-metal target.
      - name: Install Rust 1.100.0 with x86_64-unknown-none
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: x86_64-unknown-none
          components: clippy, rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --release -- -D warnings

      - name: Build workspace in release mode
        run: cargo build --workspace --release

      # Exercise the installed bare-metal target: libversio must stay no_std.
      - name: Build no_std sentinel for x86_64-unknown-none
        run: cargo build -p no_std_provo --target x86_64-unknown-none

  # Formal verification, offloaded to the cloud to avoid local OOM kills.
  # Each harness runs in its own job so one slow proof cannot hide the others,
  # and so the log of a timed-out proof is still uploaded.
  kani-verify:
    name: Kani (${{ matrix.harness }})
    runs-on: ubuntu-latest
    needs: lint-and-build
    # Installation, Kani codegen, and a 10-minute proof budget.
    timeout-minutes: 30
    strategy:
      # Report every harness, even after one of them times out.
      fail-fast: false
      matrix:
        harness:
          - pruvo_arbo_kanonika
          - pruvo_arbo_duplikatoj
          - pruvo_vojo_sekura
          - pruvo_legilo_neniam_panikas
          - pruvo_dekodo_limigita
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.100.0 with x86_64-unknown-none
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: x86_64-unknown-none

      # The official action installs Kani and then runs the given command.
      # `timeout` bounds the proof only, not the installation; SIGKILL avoids
      # leaving a memory-starved CBMC process behind.
      - name: Verify ${{ matrix.harness }}
        uses: model-checking/kani-github-action@v1
        with:
          command: timeout
          args: -s KILL 600 cargo kani -p libversio --harness ${{ matrix.harness }}
